version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aiavro_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: aiavro_billing

  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    container_name: aiavro_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/aiavro_billing
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile
    container_name: aiavro_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  mongodb_data:
